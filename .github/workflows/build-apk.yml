
name: Build Tercha WiFi Mic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TerchaWiFiMic_Mission2.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q TerchaWiFiMic_Mission2.zip -d source
          test -f source/TerchaWiFiMic_Mission1/android/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/TerchaWiFiMic_Mission1/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tercha-WiFi-Mic-APK
          path: source/TerchaWiFiMic_Mission1/android/app/build/outputs/apk/debug/app-debug.apk
